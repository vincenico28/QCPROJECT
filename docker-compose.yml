services:
  # ----------------------------------------------------------------------------
  # 1. Frontend & Serverless SSR Gateway (TanStack Start + Nitro)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_AI_SERVICE_URL=${VITE_AI_SERVICE_URL:-https://ai-detection-back-end.hostforgeplatforms.com}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://wcprajgotifqgwdjnpss.supabase.co}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY:-sb_publishable_Xw_6U8zHYrNcuU--0tbbmQ_QTDbsQew}
        - VITE_SUPABASE_PROJECT_ID=${VITE_SUPABASE_PROJECT_ID:-wcprajgotifqgwdjnpss}
    container_name: qc-flow-guardian-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - NITRO_PRESET=node-server
      # Set VITE_AI_SERVICE_URL to HostForge AI endpoint or override via .env
      - VITE_AI_SERVICE_URL=${VITE_AI_SERVICE_URL:-https://ai-detection-back-end.hostforgeplatforms.com}
    depends_on:
      ai-service:
        condition: service_started
    networks:
      - qc-network

  # ----------------------------------------------------------------------------
  # 2. Real-Time AI Computer Vision Microservice (FastAPI + YOLOv8 + OpenCV)
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: ./services/ai_violation_service
      dockerfile: Dockerfile
    container_name: qc-flow-guardian-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    networks:
      - qc-network

networks:
  qc-network:
    driver: bridge
