services:
  # ----------------------------------------------------------------------------
  # 1. Frontend & Serverless SSR Gateway (TanStack Start + Nitro)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qc-flow-guardian-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - NITRO_PRESET=node-server
      # Change localhost to your HostForge server IP or domain in production
      - VITE_AI_SERVICE_URL=http://localhost:8000
    depends_on:
      ai-service:
        condition: service_started
    networks:
      - qc-network

  # ----------------------------------------------------------------------------
  # 2. Real-Time AI Computer Vision Microservice (FastAPI + YOLOv8 + OpenCV)
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: ./services/ai_violation_service
      dockerfile: Dockerfile
    container_name: qc-flow-guardian-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    networks:
      - qc-network

networks:
  qc-network:
    driver: bridge
